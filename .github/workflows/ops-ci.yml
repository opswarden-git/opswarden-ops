---
# Ops CI — formate et valide l'IaC (prettier + terraform fmt).
name: Ops CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prettier check (yaml / md / json)
        run: npx --yes prettier --check "**/*.{yaml,yml,md,json}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init (backend disabled)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -ignore-missing-schemas \
            -summary \
            $(find k8s -name '*.yaml' | sort)
