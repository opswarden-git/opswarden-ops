---
# Validates the infrastructure definitions on every proposed change.
name: Validate infrastructure
run-name: Infrastructure checks for ${{ github.ref_name }}

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate infrastructure definitions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext-base shellcheck

      - name: Prettier check (yaml / md / json)
        run: npx --yes prettier --check "**/*.{yaml,yml,md,json}"

      - name: Shellcheck deployment scripts
        run: shellcheck scripts/*.sh

      - name: Require executable workflow scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            rg --no-filename --only-matching '\./scripts/[A-Za-z0-9._/-]+\.sh' \
              .github/workflows |
              sort --unique
          )
          for invocation in "${scripts[@]}"; do
            script=${invocation#./}
            mode=$(git ls-files --stage -- "$script" | awk '{print $1}')
            if [ "$mode" != 100755 ]; then
              echo "$script is invoked directly by a workflow but has mode ${mode:-untracked}" >&2
              exit 1
            fi
          done

      - name: Reject plaintext secret manifests
        run: make check-plaintext-secret-manifests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init (backend disabled)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      # `terraform validate` only checks that the configuration is internally
      # coherent. tflint catches provider-level mistakes it accepts, and until
      # now the target ended in `|| true` and no workflow ever called it.
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.61.0

      - name: Terraform lint
        run: make tf-lint

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          rendered=$(mktemp -d)
          TLS_ISSUER=letsencrypt-test ACME_EMAIL=test@example.invalid \
            envsubst "\${TLS_ISSUER} \${ACME_EMAIL}" \
            < k8s/cert-manager/letsencrypt.clusterissuer.yaml.tmpl \
            > "$rendered/clusterissuer.yaml"
          TLS_ISSUER=letsencrypt-test API_HOST=api.example.invalid NAMESPACE=default \
            envsubst "\${TLS_ISSUER} \${API_HOST} \${NAMESPACE}" \
            < k8s/server/server.ingress.tls.yaml.tmpl \
            > "$rendered/ingress-tls.yaml"
          mapfile -t manifests < <(find k8s -name '*.yaml' ! -name '*.sops.yaml' | sort)
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$rendered:/rendered:ro" \
            -w /workspace \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -ignore-missing-schemas \
            -summary \
            "${manifests[@]}" \
            /rendered/clusterissuer.yaml /rendered/ingress-tls.yaml
