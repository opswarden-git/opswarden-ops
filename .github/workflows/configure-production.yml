---
name: Configure production cluster
run-name: Configure the production cluster for ${{ github.actor }}

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIGURE_PRODUCTION
        required: true
        type: string
      prove_scaling:
        description: Exercise a controlled server HPA scale event (2 -> 3)
        required: false
        default: false
        type: boolean
      apply_network_policies:
        description: Apply and prove the production NetworkPolicy set
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: opswarden-production
  cancel-in-progress: false

jobs:
  configure:
    name: Configure production safeguards
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "Production configuration must run from main" >&2
            exit 1
          }
          [ "$CONFIRMATION" = CONFIGURE_PRODUCTION ] || {
            echo "confirmation must equal CONFIGURE_PRODUCTION" >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.1

      - name: Configure production kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KUBE_CONFIG_B64" ] || {
            echo "production secret KUBE_CONFIG_B64 is missing" >&2
            exit 1
          }
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Install and verify Metrics Server
        env:
          EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
        run: ./scripts/verify-metrics-server.sh

      - name: Prove controlled HPA scaling
        if: inputs.prove_scaling
        env:
          EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: ./scripts/prove-hpa-scaling.sh

      - name: Apply and prove production NetworkPolicies
        if: inputs.apply_network_policies
        env:
          EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: ./scripts/apply-network-policies.sh

      - name: Verify the application after configuration
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$API_ORIGIN/health" >/dev/null
          curl --fail --show-error --silent "$API_ORIGIN/about.json" |
            jq -e '.server.services | type == "array"' >/dev/null
