---
name: Deploy production

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Released version to deploy, e.g. 1.0.7 (resolved to an immutable digest)
        required: false
        type: string
      server_image:
        description: "Rollback escape hatch: a full ghcr.io/...@sha256:... reference. Overrides version."
        required: false
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opswarden-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll out immutable images
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "Production deploys must run from main" >&2
            exit 1
          }
          [ "$CONFIRMATION" = DEPLOY_PRODUCTION ] || {
            echo "confirmation must equal DEPLOY_PRODUCTION" >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the immutable server image
        id: image
        env:
          VERSION: ${{ inputs.version }}
          SERVER_IMAGE: ${{ inputs.server_image }}
        run: |
          set -euo pipefail
          if [ -n "$SERVER_IMAGE" ]; then
            # Rollback path: an operator pinned a specific digest by hand.
            case "$SERVER_IMAGE" in
              *@sha256:*) ;;
              *)
                echo "server_image must be a digest reference, not a mutable tag" >&2
                exit 1
                ;;
            esac
            resolved=$SERVER_IMAGE
          elif [ -n "$VERSION" ]; then
            resolved=$(./scripts/resolve-server-digest.sh "$VERSION")
          else
            echo "provide either version or server_image" >&2
            exit 1
          fi
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          {
            echo '## Production deploy target'
            echo
            echo "- Image: \`${resolved}\`"
            echo "- Requested by: \`${GITHUB_ACTOR}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.1

      - name: Configure production kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KUBE_CONFIG_B64" ] || {
            echo "production secret KUBE_CONFIG_B64 is missing" >&2
            exit 1
          }
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy, verify and roll back on failure
        env:
          EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          PUBLIC_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          SERVER_IMAGE: ${{ steps.image.outputs.resolved }}
        run: ./scripts/deploy-production.sh
