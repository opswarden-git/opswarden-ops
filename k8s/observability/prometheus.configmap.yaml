apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/opswarden-alertmanager.rules.yml
      - /etc/prometheus/opswarden-backup.rules.yml
      - /etc/prometheus/opswarden-logging.rules.yml
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'opswarden-server'
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: server
            action: keep
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: server
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
      - job_name: 'kubernetes-nodes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs:
          - action: replace
            source_labels: [id]
            regex: '^/machine\.slice/machine-rkt\\x2d([^\\]+)\\.+/([^/]+)\.service$'
            target_label: rkt_container_name
            replacement: '${2}-${1}'
          - action: replace
            source_labels: [id]
            regex: '^/system\.slice/(.+)\.service$'
            target_label: systemd_service_name
            replacement: '${1}'
      - job_name: 'traefik'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: traefik
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: web
            action: keep
      - job_name: 'cadvisor-daemonset'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: cadvisor
            action: keep
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: node-exporter
            action: keep
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http-metrics
            action: keep
      - job_name: 'loki'
        static_configs:
          - targets: ['loki.observability.svc.cluster.local:3100']
      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy.observability.svc.cluster.local:12345']
  opswarden-alertmanager.rules.yml: |-
    groups:
      - name: opswarden-alertmanager
        rules:
          - alert: OpsWardenAlertmanagerDeliveryFailed
            expr: increase(opswarden_alertmanager_webhook_deliveries_total{outcome="failed"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: OpsWarden failed to persist or execute an Alertmanager delivery
              description: At least one Alertmanager delivery failed during the last five minutes.
          - alert: OpsWardenAlertmanagerRejectionsHigh
            expr: increase(opswarden_alertmanager_webhook_deliveries_total{outcome="rejected"}[5m]) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: OpsWarden is rejecting Alertmanager deliveries
              description: More than five Alertmanager deliveries were rejected during a five-minute window.
          - alert: OpsWardenAlertmanagerDuplicateRatioHigh
            expr: |
              (
                sum(increase(opswarden_alertmanager_webhook_deliveries_total{outcome="duplicate"}[15m]))
                /
                clamp_min(sum(increase(opswarden_alertmanager_webhook_deliveries_total[15m])), 1)
              ) > 0.5
              and
              sum(increase(opswarden_alertmanager_webhook_deliveries_total[15m])) > 10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Alertmanager duplicate delivery ratio is high
              description: More than half of at least ten recent Alertmanager deliveries were semantic retries.
  opswarden-backup.rules.yml: |-
    groups:
      - name: opswarden-backup
        rules:
          - alert: OpsWardenBackupCronJobMissing
            expr: absent(kube_cronjob_info{cronjob="postgres-backup"})
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: OpsWarden PostgreSQL backup CronJob is missing
              description: kube-state-metrics cannot find the postgres-backup CronJob.
          - alert: OpsWardenBackupCronJobSuspended
            expr: kube_cronjob_spec_suspend{cronjob="postgres-backup"} == 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: OpsWarden PostgreSQL backups are suspended
              description: The postgres-backup CronJob has been suspended for at least ten minutes.
          - alert: OpsWardenBackupJobFailed
            expr: |
              (
                kube_job_failed{condition="true"} == 1
              )
              * on(namespace, job_name) group_left(owner_name)
              kube_job_owner{owner_kind="CronJob", owner_name="postgres-backup"} > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: OpsWarden scheduled PostgreSQL backup failed
              description: A Job owned by the postgres-backup CronJob is in the Failed condition.
          - alert: OpsWardenBackupNeverSucceeded
            expr: |
              (
                time() - kube_cronjob_created{cronjob="postgres-backup"} > 93600
              )
              unless on(namespace, cronjob)
              kube_cronjob_status_last_successful_time{cronjob="postgres-backup"}
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: OpsWarden PostgreSQL backup has never succeeded
              description: The CronJob is older than the 26-hour RPO alert threshold without a successful scheduled run.
          - alert: OpsWardenBackupStale
            expr: |
              time() - kube_cronjob_status_last_successful_time{cronjob="postgres-backup"} > 93600
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: OpsWarden PostgreSQL backup is stale
              description: The last successful scheduled backup is older than the 26-hour RPO alert threshold.
  opswarden-logging.rules.yml: |-
    groups:
      - name: opswarden-logging
        rules:
          - alert: OpsWardenLokiUnavailable
            expr: up{job="loki"} != 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: The centralized log store is unavailable
              description: Prometheus has been unable to scrape Loki for five minutes.
          - alert: OpsWardenAlloyUnavailable
            expr: up{job="alloy"} != 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: The Kubernetes log collector is unavailable
              description: Prometheus has been unable to scrape Grafana Alloy for five minutes.
