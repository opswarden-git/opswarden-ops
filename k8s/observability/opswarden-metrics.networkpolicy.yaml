apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-server-metrics
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    # This policy can be the first ingress policy selecting the server in an
    # existing cluster. Keep every legitimate caller here so enabling metrics
    # never cuts the public application path.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-public
          podSelector:
            matchLabels:
              app: traefik
        - podSelector:
            matchLabels:
              app: client-web
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
