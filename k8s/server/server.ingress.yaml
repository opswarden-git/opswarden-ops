apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opswarden-api
spec:
  ingressClassName: traefik
  rules:
    - host: api.opswarden.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
