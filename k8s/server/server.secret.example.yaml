apiVersion: v1
kind: Secret
metadata:
  name: opswarden-server-secret
type: Opaque
stringData:
  # Dedicated runtime login: do not reuse the PostgreSQL owner/admin role.
  DATABASE_URL: "postgres://OPSWARDEN_RUNTIME_ROLE:CHANGEME@postgres:5432/CURRENT_DATABASE"
  JWT_SECRET: "GENERATE_A_LONG_RANDOM_SECRET"
  OPSWARDEN_VAULT_KEY: "GENERATE_EXACTLY_64_HEXADECIMAL_CHARACTERS"
  OPSWARDEN_KICKOFF_TOKEN: "GENERATE_A_PRIVATE_KICKOFF_TOKEN"
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  GITHUB_AUTH_CLIENT_ID: ""
  GITHUB_AUTH_CLIENT_SECRET: ""
  GITHUB_OAUTH_CLIENT_ID: ""
  GITHUB_OAUTH_CLIENT_SECRET: ""
  GIPHY_API_KEY: ""
