apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-public
  labels:
    app: traefik
spec:
  # DOKS provisions the public DigitalOcean load balancer. The fixed nodePort is
  # retained so the same manifest remains reachable in the local minikube lab.
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30021
    - name: websecure
      port: 443
      targetPort: 443
      nodePort: 30443
