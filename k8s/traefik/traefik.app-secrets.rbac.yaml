apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-ingress-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-ingress-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-ingress-secrets
subjects:
  - kind: ServiceAccount
    name: traefik-ingress-controller
    namespace: kube-public
