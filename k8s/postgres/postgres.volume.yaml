# Le stockage est provisionné par la StorageClass par défaut du cluster :
# `do-block-storage` sur DOKS et `standard` sur minikube. Ne pas figer le nom ici
# permet au même manifeste validé d'être utilisé pour le test de restauration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
