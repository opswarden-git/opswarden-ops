apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app: postgres-backup
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7500
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          serviceAccountName: postgres-backup-sa
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 20000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -o pipefail
                  trap 'status=$?; if [ "$status" -ne 0 ]; then touch /backup/failed; fi' EXIT
                  umask 077
                  run_dir=/backup/run
                  mkdir -p "$run_dir"
                  for _ in $(seq 1 30); do
                    pg_isready -q && break
                    sleep 2
                  done
                  pg_isready -q
                  pg_dump --clean --if-exists --create --no-owner --no-privileges \
                    | gzip -9 > "$run_dir/cluster.sql.gz"
                  gzip -t "$run_dir/cluster.sql.gz"
                  cd "$run_dir"
                  sha256sum cluster.sql.gz > SHA256SUMS
                  date -u +%Y-%m-%dT%H:%M:%SZ > CREATED_AT
                  touch /backup/ready
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-role-secret
                      key: BACKUP_ROLE
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-role-secret
                      key: BACKUP_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
            - name: upload
              image: rclone/rclone@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  for _ in $(seq 1 720); do
                    if [ -f /backup/failed ]; then
                      echo "database dump failed" >&2
                      exit 1
                    fi
                    [ -f /backup/ready ] && break
                    sleep 10
                  done
                  [ -f /backup/ready ] || { echo "database dump timed out" >&2; exit 1; }
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  export RCLONE_CONFIG_BACKUP_REMOTE="s3:${BACKUP_BUCKET}/${BACKUP_PREFIX}"
                  rclone copy /backup/run "backup:${stamp}" --immutable
                  rclone check /backup/run "backup:${stamp}" --download --one-way
                  rclone delete backup: --min-age "${BACKUP_RETENTION}" --rmdirs
              envFrom:
                - secretRef:
                    name: postgres-backup-secret
                - configMapRef:
                    name: postgres-backup-config
              env:
                - name: RCLONE_CONFIG_S3_TYPE
                  value: s3
                - name: RCLONE_CONFIG_S3_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_S3_ACL
                  value: private
                - name: RCLONE_CONFIG_BACKUP_TYPE
                  value: crypt
                - name: RCLONE_CONFIG_BACKUP_FILENAME_ENCRYPTION
                  value: standard
                - name: RCLONE_CONFIG_BACKUP_DIRECTORY_NAME_ENCRYPTION
                  value: "true"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10000
                runAsGroup: 10000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: rclone-cache
                  mountPath: /.cache
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 10Gi
            - name: rclone-cache
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
