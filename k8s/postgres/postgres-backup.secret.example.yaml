apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-secret
type: Opaque
stringData:
  # Restricted DigitalOcean Spaces keys, scoped to the backup bucket.
  RCLONE_CONFIG_S3_ACCESS_KEY_ID: "REPLACE_WITH_SPACES_ACCESS_KEY"
  RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "REPLACE_WITH_SPACES_SECRET_KEY"
  # Generate an independent encryption password, then obscure it before SOPS:
  #   rclone obscure 'A_LONG_RANDOM_BACKUP_ENCRYPTION_PASSWORD'
  RCLONE_CONFIG_BACKUP_PASSWORD: "REPLACE_WITH_RCLONE_OBSCURED_PASSWORD"
